<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>

<body>
    <h1>Form</h1>

    <fieldset>
        <legend>This is Form</legend>
        <form action="">
            <div>
                <label for="">Username :-</label> <input type="text">
            </div><br>
            <div>
                <label for="">Password :-</label> <input type="password">
            </div><br>
            <div>
                <label for="">City Of :-</label> <input type="text">
            </div><br>
            <div>
                <label for="">Web Server :- </label>
                <select name="" id="">
                    <option value="">Choose a server</option>
                    <option value="">Apache</option>
                    <option value="">Nginx</option>
                    <option value="">IIS (Internet Information Services)</option>
                    <option value="">All of the above</option>
                </select>
            </div><br>
            <div>
                <label for="">Please Specify Your ROle :- </label>
                <input type="radio" name="Specify" id=""> Admin
                <input type="radio" name="Specify" id=""> Engineer
                <input type="radio" name="Specify" id=""> Manager
                <input type="radio" name="Specify" id=""> Guest
            </div><br>
            <div>
                <label for="">Single Sign on the folloving :- </label>
                <input type="checkbox" value="Mail" name="" id=""> Mail
                <input type="checkbox" value="Payroll" name="" id=""> Payroll
                <input type="checkbox" value="Self-Service" name="" id=""> Self-Service
            </div><br>
            <div>
                <input type="submit" value="Login" name="" id=""> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <input type="submit" value="Reset" name="" id="">
            </div>
        </form>
    </fieldset>
</body> 
</html>
